name: CI Quality Check

on:
  push:
    branches:
      - '**'

jobs:
  check-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24' 
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # 1. Prettier check
      - name: Run Prettier check
        continue-on-error: true 
        run: npx prettier --check .
        

      # 2. TypeScript check
      - name: Run TypeScript typecheck
        run: npx tsc --noEmit

    # 3. 執行測試並將結果寫入 GitHub Step Summary
      - name: Run Tests and Generate Summary
        if: always()
        run: |
          echo "## 📋 CI 檢查總結" >> $GITHUB_STEP_SUMMARY
          
          # 檢查 Prettier 狀態並顯示在 Summary
          if [ "${{ steps.prettier_step.outcome }}" == "failure" ]; then
            echo "### Prettier check failed" >> $GITHUB_STEP_SUMMARY
          else
            echo "### Prettier check passed" >> $GITHUB_STEP_SUMMARY
          fi

          echo "測試執行結果" >> $GITHUB_STEP_SUMMARY
          echo "<details><summary>Click here Log</summary>" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`text" >> $GITHUB_STEP_SUMMARY
          
          
          NO_COLOR=1 npm test 2>&1 | tee test-output.log || echo "TEST_FAILED=true" >> $GITHUB_ENV
          
          # 將 Log 寫入 Summary
          cat test-output.log >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "</details>" >> $GITHUB_STEP_SUMMARY
            if [ "$TEST_FAILED" = "true" ]; then
                echo "Tests failed. See summary for details."
                exit 1
            fi