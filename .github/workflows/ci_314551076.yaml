name: CI Quality Check

on:
  push:
    branches:
      - '**'

jobs:
  check-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # 1. Prettier 格式檢查
      - name: Run Prettier check
        run: npx prettier --check .

      # 2. TypeScript 型別檢查
      - name: Run TypeScript typecheck
        run: npx tsc --noEmit

      # 3. 執行測試並將結果寫入 GitHub Step Summary
      - name: Run Tests and Generate Summary
        # 確保就算前面的測試失敗，也能捕捉到錯誤代碼，並把 log 印在介面上
        run: |
          echo "## 🧪 測試執行結果" >> $GITHUB_STEP_SUMMARY
          echo "<details><summary>點擊展開測試詳細 Log</summary>" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`text" >> $GITHUB_STEP_SUMMARY
          
          # 執行測試，並將輸出同時顯示在終端機與存入暫存檔 (使用 pipefail 確保測試失敗時能回傳錯誤)
          set -o pipefail
          npm test 2>&1 | tee test-output.log
          
          # 將測試結果附加到 Summary UI 上
          cat test-output.log >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "</details>" >> $GITHUB_STEP_SUMMARY