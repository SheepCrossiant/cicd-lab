name: CI Quality Check

on:
  push:
    branches:
      - '**'

jobs:
  check-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24' 
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # 1. Prettier 格式檢查
      - name: Run Prettier check
        # 如果你希望即使 Prettier 沒過也繼續跑測試，可以加上下一行
        # continue-on-error: true
        run: npx prettier --check .

      # 2. TypeScript 型別檢查
      - name: Run TypeScript typecheck
        run: npx tsc --noEmit

    # 3. 執行測試並將結果寫入 GitHub Step Summary
      - name: Run Tests and Generate Summary
        if: always()
        run: |
          echo "測試執行結果" >> $GITHUB_STEP_SUMMARY
          echo "<details><summary>▶ Click here Log</summary>" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`text" >> $GITHUB_STEP_SUMMARY
          
          
          NO_COLOR=1 npm test 2>&1 | tee test-output.log || echo "TEST_FAILED=true" >> $GITHUB_ENV
          
          # 將 Log 寫入 Summary
          cat test-output.log >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "</details>" >> $GITHUB_STEP_SUMMARY
          
          # 判斷測試結果
          if [ "$TEST_FAILED" == "true" ]; then 
            echo "測試失敗" >> $GITHUB_STEP_SUMMARY
            exit 1
          else
            echo "測試通過 (若上方整體亮紅燈，點擊左側選單檢查是否為 Prettier 或 TS 檢查失敗)" >> $GITHUB_STEP_SUMMARY
          fi